<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visual Trends Labs</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #1f2328;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 720px;
        margin: 24px;
        padding: 40px;
        background: #fff;
        border: 1px solid #d0d5dd;
        border-radius: 16px;
        box-shadow: 0 16px 40px rgba(16, 24, 40, 0.06);
      }
      .eyebrow {
        color: #e60023;
        font-weight: 700;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3.2rem);
        line-height: 1.05;
      }
      p {
        color: #667085;
        line-height: 1.65;
        font-size: 1.05rem;
      }
      a {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 18px;
        border-radius: 10px;
        background: #e60023;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
      a:hover {
        background: #c9001f;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">SOANE</div>
      <h1>Visual Trends Lab</h1>
      <p>
        Ferramenta interna para análise de tendências visuais, palavras-chave
        e intenção de busca em conteúdos do Pinterest.
      </p>
      <a href="./politica-de-privacidade.html">Ver Política de Privacidade</a>
    </main>
  </body>
</html>
